name: Deploy App

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to deploy (e.g. v1.0.0)"
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      HOST: root@178.72.138.151
      DEPLOY_DIRECTORY: /root/apps/url-shortener

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build app
        run: |
          go mod download
          go build -o url-shortener ./cmd/url-shortener

      - name: Prepare SSH key and tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ssh rsync
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > deploy_key.pem
          chmod 600 deploy_key.pem
          ssh -i deploy_key.pem -o StrictHostKeyChecking=no ${{ env.HOST }} "mkdir -p ${{ env.DEPLOY_DIRECTORY }}"

      - name: Sync files to server
        run: |
          rsync -avz \
            -e "ssh -i deploy_key.pem -o StrictHostKeyChecking=no" \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='*.exe' \
            --exclude='*.log' \
            --exclude='.idea' \
            --exclude='.vscode' \
            ./ ${{ env.HOST }}:${{ env.DEPLOY_DIRECTORY }}

      - name: Show server contents (debug)
        run: |
          ssh -i deploy_key.pem -o StrictHostKeyChecking=no ${{ env.HOST }} "ls -la ${{ env.DEPLOY_DIRECTORY }} && ls -la ${{ env.DEPLOY_DIRECTORY }}/config || true"